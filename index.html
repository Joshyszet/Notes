
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Floor Plan Notes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      line-height: 1.6;
    }

    h1 {
      margin-bottom: 20px;
    }

    .notes {
      font-size: 16px;
    }

    .note {
      margin: 12px 0;
    }

    #music {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 200px;
      height: 200px;
      border: 0;
    }
  </style>
</head>

<body>
  <h1>Floor Planning Notes</h1>

  <div class="notes">
    <p class="note">1. Double Check in Shed first</p>
    <p class="note">2. Before exporting the Floor plan you should check if they have special doors</p>
    <p class="note">3. Correcting Furniture Placement</p>
    <p class="note">4. Checking alignment</p>
    <p class="note">5. Double Check Furniture placement</p>
  </div>

  <!-- Hidden YouTube playlist player -->
  <iframe
    id="music"
    src="https://www.youtube.com/embed/videoseries?list=RDN3wuLceSQPA&enablejsapi=1&autoplay=0"
    title="Background music"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; encrypted-media"
  ></iframe>

  <script>
    const music = document.getElementById("music");

    // Add your YouTube playlist IDs here.
    // The first playlist is the default.
    const playlists = [
      "RDCYqYGSzGHHM",
      "RDN3wuLceSQPA",
      "PLmZysP4qaYvpuPBGtA7CpTr3hu9RZ-E6k",
      "RDBF2_ipR1OI0",
      "RDYQ-qToZUybM"
    ];

    let currentPlaylist = 0;
    let started = false;
    let paused = false;

    function loadPlaylist(index, autoplay = true) {
      currentPlaylist =
        (index + playlists.length) % playlists.length;

      const url = new URL(
        "https://www.youtube.com/embed/videoseries"
      );

      url.searchParams.set(
        "list",
        playlists[currentPlaylist]
      );
      url.searchParams.set("enablejsapi", "1");
      url.searchParams.set("autoplay", autoplay ? "1" : "0");
      url.searchParams.set("playsinline", "1");
      url.searchParams.set("origin", window.location.origin);

      music.src = url.toString();
      started = autoplay;
      paused = false;
    }

    function sendYouTubeCommand(func) {
      music.contentWindow.postMessage(
        JSON.stringify({
          event: "command",
          func: func,
          args: []
        }),
        "https://www.youtube.com"
      );
    }

    // Start music on the first page click.
    document.addEventListener("click", function startOnce() {
      if (!started) {
        loadPlaylist(currentPlaylist, true);
      }
    }, { once: true });

    // The only keyboard shortcut: Ctrl + P
    document.addEventListener("keydown", function(event) {
      if (
        event.ctrlKey &&
        !event.altKey &&
        !event.metaKey &&
        event.key.toLowerCase() === "p"
      ) {
        event.preventDefault();

        if (!started) {
          loadPlaylist(currentPlaylist, true);
          return;
        }

        if (paused) {
          sendYouTubeCommand("playVideo");
          paused = false;
        } else {
          sendYouTubeCommand("pauseVideo");
          paused = true;
        }
      }
    });
  </script>
</body>
</html>
